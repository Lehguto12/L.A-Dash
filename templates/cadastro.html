{% extends "auth_base.html" %}
{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
<h2 class="auth-titulo">Criar sua conta</h2>

<form method="post" action="{{ url_for('auth.cadastro') }}" class="auth-form" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" value="{{ nome }}" required autofocus minlength="2" maxlength="100" autocomplete="name">

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" value="{{ email }}" required maxlength="255" autocomplete="email">

    <label for="senha">Senha (mín. 8 caracteres)</label>
    <input type="password" id="senha" name="senha" required minlength="8" maxlength="128" autocomplete="new-password">

    <label for="confirmar">Confirmar senha</label>
    <input type="password" id="confirmar" name="confirmar" required minlength="8" maxlength="128" autocomplete="new-password">

    <button type="submit" class="auth-btn">Criar conta</button>
</form>

<p class="auth-rodape">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
{% endblock %}
